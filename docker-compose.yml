services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: budgetbasket
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: budgetbasket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://budgetbasket:localdev@db:5432/budgetbasket
      CORS_ORIGINS: http://localhost:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PRODUCT_SEARCH_BACKEND: ${PRODUCT_SEARCH_BACKEND:-legacy}
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_PRODUCT_INDEX: budgetbasket-products-v1
    depends_on:
      - db
      - opensearch

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

volumes:
  pgdata:

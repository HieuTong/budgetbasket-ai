name: Keep services awake

# Supabase's free plan pauses a project after about a week with too little database
# activity, and Render's free plan sleeps when idle. A few real requests a day,
# touching the database, keep both available for visitors.
on:
  schedule:
    - cron: "0 */8 * * *"   # every 8 hours (UTC)
  workflow_dispatch:         # lets you run it by hand to test

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Database readiness (runs SELECT 1)
        run: |
          curl -fsS --max-time 120 --retry 3 --retry-delay 20 \
            https://budgetbasket-backend.onrender.com/ready
      - name: Real catalogue query (reads product data)
        run: |
          curl -fsS --max-time 120 --retry 3 --retry-delay 20 \
            "https://budgetbasket-backend.onrender.com/api/catalog/products?search=milk&limit=1" \
            -o /dev/null
          echo "Database answered."
